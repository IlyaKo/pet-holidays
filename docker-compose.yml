services:

  petholidays-frontend:
    container_name: petholidays-frontend
    build:
      context: ./src/frontend
      dockerfile: Dockerfile 
    ports:
      - "80:80"  

  petholidays-core-webapi:
    container_name: petholidays-core-webapi
    build:
      context: ./src/backend/LosTomates.PetHolidays.Core
      dockerfile: LosTomates.PetHolidays.Core.WebApi/Dockerfile 
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CoreDb=Host=postgres;Port=5432;Database=PetHolidaysCore;User id=postgres;Password=password
    depends_on:
      - postgres
    networks:
      - pet-holidays-network 

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: PetHolidaysCore
    ports:
      - "5433:5432"
    volumes:
      - pet-holidays-core-volume:/var/lib/postgresql/data
    networks:
      - pet-holidays-network

  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"

networks:
  pet-holidays-network:
    driver: bridge

volumes:
  pet-holidays-core-volume:
